name: Mirror source CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mirror-source-tests:
    name: Mirror source tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python offline test suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B -m unittest discover -v -p 'test_mirror*.py'
      - name: Browser JavaScript syntax
        run: node --check mirror_api/static/app.js
